name: florashop
description: Sistem Mobile FloraShop
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  cupertino_icons: ^1.0.6
  fl_chart: ^0.67.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.0.0
  http: ^1.6.0
  intl: ^0.19.0
  path_provider: ^2.1.5
  pdf: ^3.12.0
  printing: ^5.14.3
  provider: ^6.1.1
  share_plus: ^12.0.2
 

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
    

flutter:
  uses-material-design: true
  assets:
    - assets/icons/flower_header.svg
    - assets/icons/app_icon.png
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Medium.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/fonts/Roboto-Black.ttf

  
  
